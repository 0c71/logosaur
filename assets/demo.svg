<svg xmlns="http://www.w3.org/2000/svg" width="500" height="154" viewBox="0 0 500 154" role="img" aria-label="logosaur output in a terminal: colored DBG, INF, WRN, ERR and FTL lines with key=value fields">
  <rect width="500" height="154" rx="10" fill="#1a1b26"/>
  <circle cx="18" cy="16" r="5" fill="#ff5f57"/>
  <circle cx="35" cy="16" r="5" fill="#febc2e"/>
  <circle cx="52" cy="16" r="5" fill="#28c840"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c0caf5" xml:space="preserve">
    <text x="16" y="50">14:02:03 <tspan fill="#5fffd7" font-weight="bold">INF</tspan> 🦖 hatched <tspan fill="#6b7089">name</tspan>=rex <tspan fill="#6b7089">mood</tspan>="very hungry"</text>
    <text x="16" y="72">14:02:04 <tspan fill="#5f5fff" font-weight="bold">DBG</tspan> counting teeth <tspan fill="#6b7089">count</tspan>=60</text>
    <text x="16" y="94">14:02:05 <tspan fill="#d7ff87" font-weight="bold">WRN</tspan> meteor spotted <tspan fill="#6b7089">distance</tspan>="very close"</text>
    <text x="16" y="116">14:02:06 <tspan fill="#ff5f87" font-weight="bold">ERR</tspan> lunch escaped <tspan fill="#6b7089">species</tspan>=raptor <tspan fill="#6b7089">speed</tspan>=fast</text>
    <text x="16" y="138">14:02:07 <tspan fill="#af5fd7" font-weight="bold">FTL</tspan> extinct <tspan fill="#6b7089">cause</tspan>=meteor</text>
  </g>
</svg>
